# Общая часть для локальной разработки и прода. Что добавляется сверху — в docker-compose.local.yml
# и docker-compose.prod.yml; нужный набор задаёт COMPOSE_FILE в .env.
x-common: &common
    restart: unless-stopped
    init: true
    logging:
        driver: json-file
        options:
            max-size: '10m'
            max-file: '5'

x-php: &php
    <<: *common
    build:
        context: ./docker/php-fpm
        target: ${PHP_TARGET:-local}
        args:
            PUID: '${PUID:-1000}'
            PGID: '${PGID:-1000}'
    image: selfbio/php:${PHP_TARGET:-local}
    volumes:
        - './:/var/www/html'
    networks:
        - backend

services:
    nginx:
        <<: *common
        image: nginx:1.30-alpine
        depends_on:
            php:
                condition: service_healthy
        ports:
            - '${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80'
        volumes:
            - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
            - './public:/var/www/html/public:ro'
            - './storage/app/public:/var/www/html/storage/app/public:ro'
        healthcheck:
            test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/up || exit 1']
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
        networks:
            - backend

    php:
        <<: *php
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong']
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
        stop_grace_period: 30s

    # Бот входа через Telegram: тот же образ, долгий опрос getUpdates вместо php-fpm.
    telegram-bot:
        <<: *php
        command: ['php', 'artisan', 'telegram:poll']
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        stop_grace_period: 30s

    pgsql:
        <<: *common
        image: postgres:17.11
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -q -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        stop_grace_period: 60s
        networks:
            - backend

    redis:
        <<: *common
        image: redis:8-alpine
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - 'sail-redis:/data'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - backend

    # Сборка фронтенда и Vite в режиме разработки: запускается по требованию (make npm / make build / make dev).
    node:
        image: node:24-alpine
        profiles: ['tools']
        user: '${PUID:-1000}:${PGID:-1000}'
        working_dir: /var/www/html
        environment:
            HOME: /tmp
        volumes:
            - './:/var/www/html'
        ports:
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        networks:
            - backend

networks:
    backend:
        driver: bridge

# Имена томов остались от Sail: в них лежат данные БД и Redis.
volumes:
    sail-pgsql:
    sail-redis:
