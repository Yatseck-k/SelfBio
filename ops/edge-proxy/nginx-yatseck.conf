# Install on a separate edge VPS after copying the existing certificate.
# The origin is pinned to its current IP so the public DNS can point here.
server {
    listen 80;
    server_name yatseck.ru www.yatseck.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yatseck.ru www.yatseck.ru;

    ssl_certificate /etc/nginx/tls/yatseck/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/yatseck/privkey.pem;

    client_max_body_size 20m;
    access_log /var/log/nginx/yatseck-edge.access.log;
    error_log /var/log/nginx/yatseck-edge.error.log warn;

    location / {
        proxy_pass https://217.11.166.118;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name yatseck.ru;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
