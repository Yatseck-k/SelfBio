# Connection metadata for requests that complete the TLS handshake.
# Keep request arguments and headers out of this log.
log_format yatseck_diagnostic escape=json
    '{"time":"$time_iso8601",'
    '"ip":"$remote_addr",'
    '"port":"$remote_port",'
    '"server_port":"$server_port",'
    '"connection":"$connection",'
    '"connection_requests":"$connection_requests",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":"$status",'
    '"bytes_sent":"$bytes_sent",'
    '"request_length":"$request_length",'
    '"request_time":"$request_time",'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time",'
    '"protocol":"$server_protocol",'
    '"tls":"$ssl_protocol",'
    '"cipher":"$ssl_cipher",'
    '"tls_resumed":"$ssl_session_reused",'
    '"agent":"$http_user_agent"}';
