<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Renovation catalog</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#202723;background:#f4f6f2;font-synthesis:none;text-rendering:optimizeLegibility;--ink:#202723;--muted:#6b756f;--line:#dfe5df;--paper:#f4f6f2;--card:#fff;--green:#285a43;--soft:#e9f0e9;--blue:#315d79;--shadow:0 8px 28px #17231a0d}*{box-sizing:border-box}body{margin:0;line-height:1.52}.shell{max-width:1500px;margin:auto;padding:28px 26px 60px}.header{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:20px}.title h1{font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-.035em;margin:0 0 8px}.subtitle{color:var(--muted)}.stats{margin-top:8px;font-size:13px;color:var(--muted)}.toolbar{display:grid;grid-template-columns:minmax(230px,1fr) repeat(3,minmax(145px,180px));gap:8px;width:min(840px,66%)}input,select,button{font:inherit}input,select{background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 13px;min-width:0}input:focus,select:focus,button:focus-visible{outline:3px solid #72a98a66;outline-offset:1px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}.nav{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px;box-shadow:var(--shadow)}.room-label{padding:12px 10px 4px;color:#818b84;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.09em}.nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:transparent;border-radius:8px;padding:8px 10px;text-align:left;color:var(--ink);cursor:pointer}.nav button:hover,.nav button.active{background:var(--soft);color:var(--green)}.nav .all-btn{font-weight:700;border-bottom:1px solid var(--line);border-radius:0;padding-bottom:12px;margin-bottom:3px}.count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.main-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 2px 12px}.main-head h2{font-size:23px;letter-spacing:-.025em;margin:0}.results{color:var(--muted);font-size:13px;white-space:nowrap}.message{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 18px;margin:0 0 12px;box-shadow:var(--shadow);scroll-margin-top:12px;transition:opacity .15s,background .15s}.message.inactive{background:#eceeeb;border-color:#d9ded9;color:#59625c}.message.inactive .media img{filter:grayscale(.45);opacity:.78}.message-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:12px}.author{font-weight:700;color:var(--green)}.section-chip,.stale-badge{padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--green);font-size:11px}.stale-badge{background:#dfe2df;color:#4b544d;font-weight:700}.source-link{color:var(--blue);text-decoration:none}.source-link:hover,.body a:hover,.links a:hover{text-decoration:underline}.body{white-space:pre-wrap;overflow-wrap:anywhere}.body a,.links a{color:var(--blue);overflow-wrap:anywhere}.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:13px}.media figure{margin:0;min-width:0}.media img{display:block;width:100%;height:190px;object-fit:cover;border-radius:8px;background:#edf0ec}.media figcaption{font-size:11px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.files,.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.attachment{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--blue);font-size:12px;overflow-wrap:anywhere}.attachment:hover{background:#f5f8f5}.links{flex-direction:column;align-items:flex-start;gap:4px;font-size:13px}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:14px;padding-top:11px;border-top:1px solid #e9ede9}.action{border:1px solid var(--line);background:white;border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;color:var(--ink)}.action:hover{border-color:#9ab5a2;background:#f5faf6}.action.primary{color:#fff;background:var(--green);border-color:var(--green)}.action.primary:hover{background:#1e4b36}.message.inactive .action{background:#f7f8f6}.empty{background:#fff;border:1px solid var(--line);border-radius:12px;padding:42px 20px;text-align:center;color:var(--muted)}.more-wrap{text-align:center;padding:8px 0 26px}.load-more{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 18px;cursor:pointer}.undo-bar{display:none;position:sticky;bottom:14px;margin:16px auto 0;width:max-content;max-width:100%;align-items:center;gap:12px;padding:10px 12px;background:#202723;color:white;border-radius:10px;box-shadow:var(--shadow);z-index:4}.undo-bar.visible{display:flex}.undo-bar button{border:0;border-radius:7px;padding:6px 10px;color:#202723;background:#fff;cursor:pointer}.toast{position:fixed;right:18px;bottom:18px;z-index:8;max-width:min(440px,calc(100vw - 36px));padding:12px 16px;border-radius:10px;background:#24342a;color:white;box-shadow:var(--shadow);display:none}.toast.error{background:#8a332b}.toast.show{display:block}.modal-backdrop{position:fixed;inset:0;background:#10181280;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 24px 80px #0003}.modal h2{margin:0 0 7px;font-size:21px}.modal p{color:var(--muted);margin:0 0 14px}.modal label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}.modal select{width:100%}.move-summary{background:var(--paper);border-radius:9px;padding:11px 12px;margin:12px 0 16px;font-size:13px;overflow-wrap:anywhere}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.modal-actions button{padding:9px 14px}.loading,.fatal{max-width:660px;margin:12vh auto;padding:28px;background:white;border:1px solid var(--line);border-radius:14px}.fatal h1{margin-top:0}.fatal code{word-break:break-word}@media(max-width:950px){.shell{padding:20px 15px 45px}.header{display:block}.toolbar{width:100%;margin-top:17px;grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.layout{grid-template-columns:1fr;gap:12px}.nav{position:static;max-height:none;display:flex;overflow:auto;gap:3px;align-items:center}.nav .room-label{display:none}.nav button{width:auto;white-space:nowrap}.nav .all-btn{border:0;margin:0;padding-bottom:8px}.main-head h2{font-size:20px}}@media(max-width:560px){.shell{padding:15px 10px 38px}.toolbar{grid-template-columns:1fr 1fr}.toolbar select{font-size:13px;padding:10px 8px}.message{padding:14px 12px}.message-top{align-items:flex-start}.media{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px}.media img{height:155px}.main-head{align-items:flex-start}.main-head h2{font-size:18px}.meta{gap:5px 8px}.actions{gap:6px}.action{padding:7px 8px}.undo-bar{width:100%;justify-content:space-between}}
.import-trigger{margin-top:10px}.import-field{margin:12px 0}.import-field input,.import-field select{width:100%}.import-note{font-size:12px}.import-modal .modal-actions{margin-top:18px}
</style>
</head>
<body>
<div class="shell" id="app" hidden>
<header class="header"><div class="title"><h1 data-i18n="title"></h1><div class="subtitle" data-i18n="subtitle"></div><div class="stats" id="stats"></div><button class="action import-trigger" id="open-import" type="button" data-i18n="importButton"></button></div>
<div class="toolbar"><input id="search" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchLabel"><select id="status-filter" data-i18n-aria="statusFilterLabel"><option value="all" data-i18n="statusAll"></option><option value="active" data-i18n="statusActive"></option><option value="inactive" data-i18n="statusInactive"></option></select><select id="kind-filter" data-i18n-aria="kindFilterLabel"><option value="all" data-i18n="kindAll"></option><option value="images" data-i18n="kindImages"></option><option value="files" data-i18n="kindFiles"></option><option value="links" data-i18n="kindLinks"></option></select><select id="sort" data-i18n-aria="sortLabel"><option value="new" data-i18n="sortNewest"></option><option value="old" data-i18n="sortOldest"></option></select></div></header>
<div class="layout"><nav class="nav" id="nav" data-i18n-aria="roomsLabel"></nav><main id="main" aria-live="polite"></main></div>
<div id="undo-bar" class="undo-bar"><span data-i18n="undoAvailable"></span><button id="undo-button" type="button" data-i18n="undoButton"></button></div>
</div>
<div id="loading" class="loading" data-i18n="loading">Loading…</div>
<div id="fatal" class="fatal" hidden><h1 data-i18n="fatalTitle">Catalog unavailable</h1><p data-i18n="fatalDescription"></p><p><span data-i18n="runInFolder"></span> <code data-i18n="projectFolder"></code> <span data-i18n="runThen"></span> <code>docker compose up -d</code>, <span data-i18n="runThenOpen"></span> <code>/repair</code>.</p><div id="fatal-error"></div></div>
<div id="import-modal" class="modal-backdrop import-modal" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="import-title"><h2 id="import-title" data-i18n="importTitle"></h2><p data-i18n="importDescription"></p><div class="import-field"><label for="import-kind" data-i18n="importKind"></label><select id="import-kind"><option value="export" data-i18n="importExport"></option><option value="parsed" data-i18n="importParsed"></option></select></div><div class="import-field"><label for="import-file" data-i18n="importFile"></label><input id="import-file" type="file" accept=".zip,application/zip"></div><p class="import-note" data-i18n="importWarning"></p><div class="modal-actions"><button class="action" id="cancel-import" type="button" data-i18n="cancel"></button><button class="action primary" id="confirm-import" type="button" data-i18n="importButton"></button></div></section></div>
<div id="toast" class="toast" role="status"></div>
<dialog id="media-viewer" class="media-viewer" aria-label="Просмотр вложения"><div class="viewer-panel"><button id="viewer-close" class="viewer-close" type="button" data-i18n-aria="closeViewer" aria-label="Закрыть">×</button><div id="viewer-content" class="viewer-content"></div><p id="viewer-caption" class="viewer-caption"></p></div></dialog>
<script>
'use strict';
const app=document.getElementById('app'), nav=document.getElementById('nav'), main=document.getElementById('main');
const search=document.getElementById('search'), statusFilter=document.getElementById('status-filter'), kindFilter=document.getElementById('kind-filter'), sort=document.getElementById('sort');
const toast=document.getElementById('toast'), undoBar=document.getElementById('undo-bar'), importModal=document.getElementById('import-modal');
const mediaViewer=document.getElementById('media-viewer'), viewerContent=document.getElementById('viewer-content'), viewerCaption=document.getElementById('viewer-caption');
const pageSize=80; let catalog=null, locale=null, selectedSection='all', query='', limit=pageSize, toastTimer=null;
let mediaOpener=null;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=(key,values={})=>String(locale?.ui?.[key]??key).replace(/\{(\w+)\}/g,(_,name)=>String(values[name]??''));
const sectionFor=id=>catalog.sections.find(s=>s.id===id);
const sectionText=section=>locale.sections[section.id]||{};
const allMessages=()=>catalog.sections.flatMap(section=>section.messages.map(message=>({section,message})));
const fmtDate=value=>{if(!value)return '';const d=new Date(value);return Number.isNaN(+d)?value:d.toLocaleString('ru-RU',{dateStyle:'medium',timeStyle:'short'});};
function applyLocale(){document.documentElement.lang=locale.language||'ru';document.title=t('documentTitle');document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.i18nPlaceholder);});document.querySelectorAll('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.i18nAria));});}
function notify(text,error=false){toast.textContent=text;toast.classList.toggle('error',error);toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),4200);}
async function api(path,payload){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','X-CSRF-TOKEN':document.querySelector('meta[name="csrf-token"]').content},body:JSON.stringify(payload)});let data={};try{data=await response.json();}catch{}if(!response.ok||!data.ok)throw new Error(data.error||t('errorAction'));return data;}
function updateStats(){const rows=allMessages();const images=rows.reduce((n,x)=>n+(x.message.images?.length||0),0);const files=rows.reduce((n,x)=>n+(x.message.attachments?.length||0),0);document.getElementById('stats').textContent=t('stats',{sections:catalog.sections.length,messages:rows.length,images,files});}
function renderNav(){const groups=[...new Set(catalog.sections.map(s=>sectionText(s).room||sectionText(s).name))];let out=`<button class="all-btn ${selectedSection==='all'?'active':''}" data-section="all">${esc(t('allSections'))}<span class="count">${allMessages().length}</span></button>`;for(const room of groups){const sections=catalog.sections.filter(s=>(sectionText(s).room||sectionText(s).name)===room);out+=`<div class="room-label">${esc(room)}</div>`+sections.map(s=>`<button class="${selectedSection===s.id?'active':''}" data-section="${esc(s.id)}">${esc(sectionText(s).zone||sectionText(s).name)}<span class="count">${s.messages.length}</span></button>`).join('');}nav.innerHTML=out;nav.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{selectedSection=button.dataset.section;limit=pageSize;render();}));}
function records(){let rows=allMessages();if(selectedSection!=='all')rows=rows.filter(x=>x.section.id===selectedSection);if(statusFilter.value!=='all')rows=rows.filter(x=>(x.message.status==='inactive'?'inactive':'active')===statusFilter.value);if(kindFilter.value==='images')rows=rows.filter(x=>x.message.images?.length);if(kindFilter.value==='files')rows=rows.filter(x=>x.message.attachments?.length);if(kindFilter.value==='links')rows=rows.filter(x=>x.message.links?.length);if(query){rows=rows.filter(({section,message:m})=>{const label=sectionText(section);return [m.text,m.author,m.date,m.id,label.name,label.room,label.zone,...(m.images||[]).map(i=>i.name),...(m.attachments||[]).map(f=>f.name),...(m.links||[]).map(l=>`${l.title||''} ${l.url||''}`)].join(' ').toLowerCase().includes(query);});}rows.sort((a,b)=>{const diff=(Date.parse(a.message.date)||0)-(Date.parse(b.message.date)||0);if(diff)return sort.value==='new'?-diff:diff;return sort.value==='new'?b.message.id-a.message.id:a.message.id-b.message.id;});return rows;}
function linkify(text){return esc(text).replace(/(https?:\/\/[^\s<]+)/g,raw=>{const url=raw.replace(/[.,;!?]+$/,'');const tail=raw.slice(url.length);return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${tail}`;});}
function mediaUrl(path){const encode=value=>value.split('/').map(encodeURIComponent).join('/');return path.startsWith('archive/')?'/archive/'+encode(path.slice(8)):'/'+encode('Ремонт/'+path);}
function mediaType(path){return /\.(mp4|mov|webm|ogv|m4v)(?:$|[?#])/i.test(path)?'video':/\.(jpe?g|png|gif|webp|heic|heif|avif)(?:$|[?#])/i.test(path)?'image':null;}
function showMediaError(url,name){const message=document.createElement('p'),download=document.createElement('a');message.textContent=t('mediaUnsupported');download.href=url;download.download=name;download.textContent=t('downloadFile');viewerContent.replaceChildren(message,download);}
function openMedia(button){const url=button.dataset.mediaUrl,name=button.dataset.mediaName||'',type=button.dataset.mediaType;const media=document.createElement(type==='video'?'video':'img');media.src=url;media.addEventListener('error',()=>showMediaError(url,name),{once:true});if(type==='video'){media.controls=true;media.preload='metadata';media.playsInline=true;}else{media.alt=name;}viewerContent.replaceChildren(media);viewerCaption.textContent=name;mediaOpener=button;mediaViewer.showModal();document.body.classList.add('viewer-open');}
document.getElementById('viewer-close').addEventListener('click',()=>mediaViewer.close());
mediaViewer.addEventListener('click',event=>{if(event.target===mediaViewer)mediaViewer.close();});
mediaViewer.addEventListener('close',()=>{const video=viewerContent.querySelector('video');if(video){video.pause();video.removeAttribute('src');video.load();}viewerContent.replaceChildren();document.body.classList.remove('viewer-open');if(mediaOpener?.isConnected)mediaOpener.focus();mediaOpener=null;});
function card(section,m){const inactive=m.status==='inactive', meta=sectionText(section);const heading=meta.zone?`${meta.room} · ${meta.zone}`:meta.name;const body=m.text?`<div class="body">${linkify(m.text)}</div>`:'';
 const images=(m.images||[]).map(image=>`<figure><button class="media-thumb media-open" type="button" data-media-type="image" data-media-url="${esc(mediaUrl(image.path))}" data-media-name="${esc(image.name)}" aria-label="${esc(t('openImage',{name:image.name}))}"><img loading="lazy" src="${esc(mediaUrl(image.path))}" alt="${esc(image.name)}"></button><figcaption>${esc(image.name)}</figcaption></figure>`).join('');
 const files=(m.attachments||[]).map(file=>{const type=mediaType(file.path);return type?`<button class="attachment media-open" type="button" data-media-type="${type}" data-media-url="${esc(mediaUrl(file.path))}" data-media-name="${esc(file.name)}">${type==='video'?'▶':'▧'} ${esc(file.name)}</button>`:`<a class="attachment" href="${esc(mediaUrl(file.path))}" target="_blank" rel="noopener">↧ ${esc(file.name)}</a>`;}).join('');
 const seenLinks=new Set((m.text||'').match(/https?:\/\/[^\s<]+/g)?.map(url=>url.replace(/[.,;!?]+$/,''))||[]);
 const links=(m.links||[]).filter(link=>{const url=(link.url||'').replace(/[.,;!?]+$/,'');if(!url||seenLinks.has(url))return false;seenLinks.add(url);return true;}).map(link=>`<a href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">${esc(link.title||link.url)}</a>`).join('');
 return `<article class="message ${inactive?'inactive':''}" id="message-${m.id}"><div class="message-top"><div class="meta"><span class="author">${esc(m.author||t('unknownAuthor'))}</span><time>${esc(fmtDate(m.date))}</time><span class="section-chip">${esc(heading)}</span>${inactive?`<span class="stale-badge">${esc(t('inactiveBadge'))}</span>`:''}</div><a class="source-link" href="/archive/messages.html#message${m.id}" target="_blank" rel="noopener">${esc(t('sourceLink'))}</a></div>${body}${images?`<div class="media">${images}</div>`:''}${files?`<div class="files">${files}</div>`:''}${links?`<div class="links">${links}</div>`:''}<div class="actions"><div class="move-picker"><button class="action primary move-toggle" data-id="${m.id}" type="button" aria-expanded="false" aria-controls="move-menu-${m.id}">${esc(t('moveTo'))} ▾</button><div class="move-menu" id="move-menu-${m.id}" hidden><label for="move-target-${m.id}">${esc(t('newSection'))}</label><select class="move-target" id="move-target-${m.id}"><option value="">${esc(t('chooseSection'))}</option>${moveOptions(section.id)}</select><button class="action primary move-confirm" data-id="${m.id}" type="button" disabled>${esc(t('move'))}</button></div></div><button class="action status-button" data-id="${m.id}" data-status="${inactive?'active':'inactive'}" type="button">${esc(t(inactive?'markActive':'markInactive'))}</button></div></article>`;}
function moveOptions(sourceId){const rooms=[...new Set(catalog.sections.map(s=>sectionText(s).room||sectionText(s).name))];return rooms.map(room=>{const sections=catalog.sections.filter(s=>s.id!==sourceId&&(sectionText(s).room||sectionText(s).name)===room);return sections.length?`<optgroup label="${esc(room)}">${sections.map(s=>`<option value="${esc(s.id)}">${esc(sectionText(s).zone||sectionText(s).name)}</option>`).join('')}</optgroup>`:'';}).join('');}
function recordTitle(section){const meta=sectionText(section);return meta.zone?`${meta.room} · ${meta.zone}`:meta.name;}
function render(){if(!catalog||!locale)return;renderNav();const rows=records();const title=selectedSection==='all'?t('allSections'):recordTitle(sectionFor(selectedSection));const shown=rows.slice(0,limit);let html=`<div class="main-head"><h2>${esc(title)}</h2><span class="results">${esc(t('records',{count:rows.length}))}</span></div>`;if(!rows.length)html+=`<div class="empty">${esc(t('emptyResults'))}</div>`;else{html+=shown.map(x=>card(x.section,x.message)).join('');if(rows.length>shown.length)html+=`<div class="more-wrap"><button class="load-more" id="load-more" type="button">${esc(t('loadMore',{count:Math.min(pageSize,rows.length-shown.length)}))}</button></div>`;}main.innerHTML=html;const more=document.getElementById('load-more');if(more)more.onclick=()=>{limit+=pageSize;render();};}
function closeMoveMenus(){main.querySelectorAll('.move-picker').forEach(picker=>{picker.querySelector('.move-menu').hidden=true;picker.querySelector('.move-toggle').setAttribute('aria-expanded','false');picker.closest('.message').classList.remove('menu-open');});}
main.addEventListener('change',event=>{const select=event.target.closest('.move-target');if(select)select.closest('.move-picker').querySelector('.move-confirm').disabled=!select.value;});
main.addEventListener('click',async event=>{
 const mediaButton=event.target.closest('.media-open');
 if(mediaButton){openMedia(mediaButton);return;}
 const toggle=event.target.closest('.move-toggle');
 if(toggle){const picker=toggle.closest('.move-picker'),wasOpen=!picker.querySelector('.move-menu').hidden;closeMoveMenus();if(!wasOpen){picker.querySelector('.move-menu').hidden=false;toggle.setAttribute('aria-expanded','true');picker.closest('.message').classList.add('menu-open');picker.querySelector('.move-target').focus();}return;}
 const confirm=event.target.closest('.move-confirm');
 if(confirm){const select=confirm.closest('.move-picker').querySelector('.move-target');if(!select.value)return;confirm.disabled=true;select.disabled=true;confirm.textContent=t('moving');try{await api('/api/move',{message_id:Number(confirm.dataset.id),target_section_id:select.value});await refreshCatalog();await refreshUndo();notify(t('moveSuccess'));}catch(error){confirm.disabled=false;select.disabled=false;confirm.textContent=t('move');notify(error.message||t('errorAction'),true);}return;}
 const status=event.target.closest('.status-button');
 if(status){status.disabled=true;try{await api('/api/status',{message_id:Number(status.dataset.id),status:status.dataset.status});const row=allMessages().find(x=>x.message.id===Number(status.dataset.id)).message;if(status.dataset.status==='inactive'){row.status='inactive';row.status_changed_at=new Date().toISOString();}else{delete row.status;delete row.status_changed_at;}render();notify(t(status.dataset.status==='inactive'?'statusSetInactive':'statusSetActive'));}catch{status.disabled=false;notify(t('errorAction'),true);}}
});
document.addEventListener('click',event=>{if(!event.target.closest('.move-picker'))closeMoveMenus();});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMoveMenus();});
async function refreshCatalog(){const response=await fetch('/api/catalog',{cache:'no-store'});if(!response.ok)throw new Error(t('errorCatalog'));catalog=await response.json();updateStats();render();}
async function refreshUndo(){try{const r=await fetch('/api/undo-state',{cache:'no-store'});const d=await r.json();undoBar.classList.toggle('visible',Boolean(d.can_undo));}catch{undoBar.classList.remove('visible');}}
document.getElementById('undo-button').addEventListener('click',async()=>{const button=document.getElementById('undo-button');button.disabled=true;try{await api('/api/undo',{});await refreshCatalog();await refreshUndo();notify(t('undoSuccess'));}catch{notify(t('errorAction'),true);}finally{button.disabled=false;}});
document.getElementById('open-import').onclick=()=>importModal.classList.add('open');
function closeImport(){importModal.classList.remove('open');}
document.getElementById('cancel-import').onclick=closeImport;
importModal.addEventListener('click',event=>{if(event.target===importModal)closeImport();});
document.getElementById('confirm-import').addEventListener('click',async event=>{const file=document.getElementById('import-file').files[0];if(!file){notify(t('importChooseFile'),true);return;}if(file.size>100*1024*1024){notify('ZIP больше 100 МБ: используйте команду импорта на сервере.',true);return;}const button=event.currentTarget;button.disabled=true;button.textContent=t('importing');try{const response=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/zip','Accept':'application/json','X-CSRF-TOKEN':document.querySelector('meta[name="csrf-token"]').content,'X-Import-Kind':document.getElementById('import-kind').value},body:file});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||t('errorAction'));closeImport();await refreshCatalog();await refreshUndo();notify(t('importSuccess',{count:result.messages}));}catch(error){notify(error.message||t('errorAction'),true);}finally{button.disabled=false;button.textContent=t('importButton');}});
for(const control of [search,statusFilter,kindFilter,sort])control.addEventListener(control===search?'input':'change',()=>{query=search.value.trim().toLowerCase();limit=pageSize;render();});
(async()=>{try{const localeResponse=await fetch('/Ремонт/locales/ru.json',{cache:'no-store'});if(!localeResponse.ok)throw new Error('locale');locale=await localeResponse.json();applyLocale();await refreshCatalog();document.getElementById('loading').hidden=true;app.hidden=false;await refreshUndo();}catch(error){document.getElementById('loading').hidden=true;document.getElementById('fatal').hidden=false;document.getElementById('fatal-error').textContent=locale?t('errorUnknown'):'Russian translation resource could not be loaded.';}})();
</script>
</body>
</html>
