; Общие настройки PHP для сайта, бота и консольных команд.
expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Загрузки в приложении маленькие (картинки до 64 КБ), запас для обложек блога.
post_max_size = 32M
upload_max_filesize = 30M

; Меры из бюллетеня PHP от 2026-10-21 (CVE-2026-109618, CVE-2026-109619) поверх исправленной версии 8.5.12.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
