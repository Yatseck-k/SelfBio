[www]
; Мастер уже запущен от www-data (USER в образе): user/group здесь не нужны.
listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no
; Переменные окружения контейнера (APP_ENV и др.) доходят до приложения.
clear_env = no

ping.path = /ping
pm.status_path = /status
